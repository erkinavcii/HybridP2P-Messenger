// HybridP2P — Android uygulaması: static/serverless.html'i internete bağlı olmadan,
// uygulamanın içinden açan küçük bir sarmalayıcı (Google servisi gerekmez).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "HybridP2P"
include ":app"
