# HybridP2P Messenger — tek komutla kurulum:
#     1) cp .env.example .env
#     2) .env içinde A (alan adı) veya B (yalnızca IP) modunu seçin —
#        adım adım açıklama .env.example dosyasının başında
#     3) docker compose up -d --build
#     4) Yalnızca B modu: docker compose logs certgen  → sertifika parmak izi
# Ayrıntılar: DEPLOY.md
name: hybridp2p

services:
  # Yalnızca IP modunda kendinden imzalı sertifika üretir (bir kez); parmak izini
  # yazdırır:  docker compose logs certgen
  certgen:
    build: .
    image: hybridp2p-messenger:latest
    command: ["python", "deploy/gen_cert.py"]
    environment:
      HYBRIDP2P_SITE: ${HYBRIDP2P_SITE:?.env içinde HYBRIDP2P_SITE ayarlanmalı}
      HYBRIDP2P_TLS: ${HYBRIDP2P_TLS:?.env içinde HYBRIDP2P_TLS ayarlanmalı}
    volumes:
      - certs:/certs
    restart: "no"

  app:
    image: hybridp2p-messenger:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HYBRIDP2P_DB_PATH: /data/relay_server.db
      HYBRIDP2P_RELOAD: "0"
      # Uygulama portu dışarıya kapalı; tek komşu Caddy → başlığa güvenmek güvenli
      HYBRIDP2P_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - data:/data
    expose:
      - "8000"
    depends_on:
      certgen:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      HYBRIDP2P_SITE: ${HYBRIDP2P_SITE}
      HYBRIDP2P_TLS: ${HYBRIDP2P_TLS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certs:/certs:ro
      - caddy_data:/data        # Let's Encrypt sertifikaları (kaybolursa yeniden alınır)
      - caddy_config:/config
    depends_on:
      - app

  # İsteğe bağlı kendi STUN/TURN sunucunuz (aramalar için). Açmak için .env'de:
  #   COMPOSE_PROFILES=turn, TURN_HOST, TURN_SECRET  (adımlar .env.example'da)
  coturn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    # TURN çok sayıda UDP portu kullanır; Linux VPS'te host ağı en sorunsuz yoldur
    # (Docker Desktop'ta — Windows/macOS — host ağı sınırlıdır, bkz. DEPLOY.md)
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret                    # kısa ömürlü kimlik (sunucu HMAC ile üretir)
      - --static-auth-secret=${TURN_SECRET:?turn profili için .env içinde TURN_SECRET gerekli}
      - --realm=${HYBRIDP2P_SITE}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Güvenlik: TURN'ün iç/özel ağlara aktarım yapmasını yasakla (SSRF/ağ tarama köprüsü olmasın)
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  data:          # relay_server.db — mesaj kuyruğu, kullanıcılar, şifreli dosyalar (YEDEKLEYİN)
  certs:         # kendinden imzalı sertifika (değişirse tüm sabitlemeler kırılır)
  caddy_data:
  caddy_config:
